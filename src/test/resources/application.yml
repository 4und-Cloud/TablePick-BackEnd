spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true

  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 100

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: email, profile
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email, phone_number, birthyear, birthday, gender, profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: test-jwt-secret-key-for-testing-purposes-only

server:
  port: 8081
  domain: http://localhost:8081

project:
  upload:
    board-image-path: test-uploads/images/board

kakao:
  admin:
    key: test-admin-key

firebase:
  service-account-file: classpath:firebase-service-account.json

logging:
  level:
    root: info
    com.goorm.tablepick: debug
    org.springframework.web: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace